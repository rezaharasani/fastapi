---
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages:
  - build
  - test
  - release

variables:
  GITLAB_DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  GITLAB_DOCKER_LATEST: $CI_REGISTRY_IMAGE:latest

  DOCKER_REGISTRY: docker.io
  DOCKER_REPO: harasani/fastapi
  DOCKER_VERSION: $CI_COMMIT_TAG
  DOCKER_IMAGE: $DOCKER_REGISTRY/$DOCKER_REPO:$DOCKER_VERSION
  DOCKER_LATEST: $DOCKER_REGISTRY/$DOCKER_REPO:latest

  CONTAINER_NAME: fastapi
  VERSION_BUMP: patch  # bump version (patch / minor / major)

.build_template:
  image: docker:28.4.0
  stage: build
  services:
    - docker:28.4.0-dind
  variables:
    DOCKER_REG: ''
    DOCKER_REG_USER: ''
    DOCKER_REG_PASS: ''
    DOCKER_REP_IMAGE: ''
    DOCKER_REP_LATEST: ''
  before_script:
    - |
      echo $DOCKER_REG_PASS | \
            docker login -u $DOCKER_REG_USER --password-stdin $DOCKER_REG
  script:
    - docker build -t $DOCKER_REP_IMAGE -t $DOCKER_REP_LATEST .
    - docker push $DOCKER_REP_IMAGE
    - docker push $DOCKER_REP_LATEST

.test_template:
  stage: test
  image: docker:28.4.0
  services:
    - docker:28.4.0-dind
  environment: test
  variables:
    DOCKER_REG: $CI_REGISTRY
    DOCKER_REG_USER: $CI_REGISTRY_USER
    DOCKER_REG_PASS: $CI_REGISTRY_PASSWORD
    DOCKER_REP_IMAGE: $GITLAB_DOCKER_IMAGE
  before_script:
    - apk add curl jq
    - docker login $DOCKER_REG -u $DOCKER_REG_USER -p $DOCKER_REG_PASS
    - docker pull $DOCKER_REP_IMAGE
    - export PROJECT_IMAGE_NAME=$DOCKER_REP_IMAGE
    - docker compose -f docker-compose-prod.yml up -d
    - docker compose -f docker-compose-prod.yml ps -a
  script:
    - echo "Put your code here."

build-docker-image:
  extends: .build_template
  variables:
    DOCKER_REG: $CI_REGISTRY
    DOCKER_REG_USER: $CI_REGISTRY_USER
    DOCKER_REG_PASS: $CI_REGISTRY_PASSWORD
    DOCKER_REP_IMAGE: $GITLAB_DOCKER_IMAGE
    DOCKER_REP_LATEST: $GITLAB_DOCKER_LATEST

test-code-lint:
  extends: .test_template
  needs:
    - build-docker-image
  script:
    - docker exec -i $CONTAINER_NAME pylint --fail-under=7.0 app/
    - docker exec -i $CONTAINER_NAME pylint --fail-under=7.0 tests/

test-units:
  extends: .test_template
  needs:
    - build-docker-image
  script:
    - |
      docker exec -i $CONTAINER_NAME pytest \
        --cov=app \
        --cov-report=xml:/tmp/coverage.xml \
        --cov-report=term-missing \
        -v --disable-warnings
    - docker cp $CONTAINER_NAME:/tmp/coverage.xml coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: '/^TOTAL.*\s+(\d+\%)$/'

test-integration:
  extends: .test_template
  needs:
    - build-docker-image
  script:
    - sleep 15
    - docker compose -f docker-compose-prod.yml ps -a
    - docker exec -i $CONTAINER_NAME curl --fail http://localhost:8000/

create-tag-and-push-docker:
  image: docker:28.4.0
  stage: release
  needs:
    - test-integration
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    VERSION_BUMP: patch  # patch / minor / major
    DOCKER_REGISTRY: docker.io
    DOCKER_REPO: harasani/fastapi
    DOCKER_REG_USER: $DOCKER_HUB_USERNAME
    DOCKER_REG_PASS: $DOCKER_HUB_ACCESS_TOKEN
    GITLAB_TOKEN: $GITLAB_FASTAPI_ACCESS_TOKEN
  before_script:
    - apk add --no-cache git python3 py3-pip bash
    - pip install bump2version
    - git config --global user.name "$GITLAB_USER_LOGIN"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git fetch --tags
    - |
       echo $DOCKER_REG_PASS | \
            docker login -u $DOCKER_REG_USER --password-stdin $DOCKER_REG
  script:
    - |
      BUMP="${VERSION_BUMP:-patch}"
      NEW_VERSION=$(bump2version $BUMP --dry-run --list | 
                    grep new_version | sed 's/new_version=//')
      echo "New version: $NEW_VERSION"
    - |
      bump2version $BUMP --commit --tag --message "Release {current_version} → {new_version} [skip ci]"
      git push https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git --tags
    - |
      export DOCKER_REP_IMAGE=$DOCKER_REGISTRY/$DOCKER_REPO:$NEW_VERSION
      export DOCKER_REP_LATEST=$DOCKER_REGISTRY/$DOCKER_REPO:latest
    - |
      docker build -t $DOCKER_REP_IMAGE -t $DOCKER_REP_LATEST .
    - docker push $DOCKER_REP_IMAGE
    - docker push $DOCKER_REP_LATEST
  after_script:
    - echo "✅ Released version $NEW_VERSION and pushed Docker image to $DOCKER_REGISTRY/$DOCKER_REPO"

