---
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages:
  - .pre
  - build
  - test
  - release
  - deploy

variables:
  GITLAB_DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  GITLAB_DOCKER_LATEST: $CI_REGISTRY_IMAGE:latest
  DOCKER_REGISTRY: docker.io
  DOCKER_REPO: harasani/fastapi
  DOCKER_IMAGE: $DOCKER_REGISTRY/$DOCKER_REPO
  CONTAINER_NAME: fastapi
  VERSION_BUMP: minor  # bump version (patch / minor / major)

check-mergeable:
  stage: .pre
  image: alpine:3.22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - when: never
  before_script:
    - apk add --no-cache jq curl
  script: |
    for i in {1..5}; do
      echo "🔍 Checking MR mergeability..."
      MR_INFO=$(curl --silent --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID")
  
      MERGE_STATUS=$(echo "$MR_INFO" | jq -r '.merge_status')
      echo "Merge status: $MERGE_STATUS"
  
      if [ "$MERGE_STATUS" = "can_be_merged" ]; then
        echo "✅ Merge request is mergeable"
        exit 0
      elif [ "$MERGE_STATUS" = "cannot_be_merged" ]; then
        echo "❌ Merge request is not mergeable"
        exit 1
      fi

      echo "⏳ Still checking, retrying in 5s..."
      sleep 5
    done

.build_template:
  image: docker:28.4.0
  stage: build
  services:
    - docker:28.4.0-dind
  variables:
    DOCKER_REG: ''
    DOCKER_REG_USER: ''
    DOCKER_REG_PASS: ''
    DOCKER_REP_IMAGE: ''
    DOCKER_REP_LATEST: ''
  before_script:
    - |
      echo $DOCKER_REG_PASS | \
           docker login -u $DOCKER_REG_USER --password-stdin $DOCKER_REG
    - docker build -t $DOCKER_REP_IMAGE -t $DOCKER_REP_LATEST .
    - docker push $DOCKER_REP_IMAGE
    - docker push $DOCKER_REP_LATEST
  script:
    - echo "Put your code here."

.test_template:
  image: docker:28.4.0
  stage: test
  services:
    - docker:28.4.0-dind
  environment: test
  variables:
    DOCKER_REG: $CI_REGISTRY
    DOCKER_REG_USER: $CI_REGISTRY_USER
    DOCKER_REG_PASS: $CI_REGISTRY_PASSWORD
    DOCKER_REP_IMAGE: $GITLAB_DOCKER_IMAGE
  before_script: |
    apk add curl jq
    echo $DOCKER_REG_PASS | \
         docker login -u $DOCKER_REG_USER --password-stdin $DOCKER_REG
    docker pull $DOCKER_REP_IMAGE
    export PROJECT_IMAGE_NAME=$DOCKER_REP_IMAGE
    docker compose -f docker-compose-prod.yml up -d
    docker compose -f docker-compose-prod.yml ps -a
  script:
    - echo "Put your code here."

build-docker-image:
  extends: .build_template
  variables:
    DOCKER_REG: $CI_REGISTRY
    DOCKER_REG_USER: $CI_REGISTRY_USER
    DOCKER_REG_PASS: $CI_REGISTRY_PASSWORD
    DOCKER_REP_IMAGE: $GITLAB_DOCKER_IMAGE
    DOCKER_REP_LATEST: $GITLAB_DOCKER_LATEST

test-code-lint:
  extends: .test_template
  needs:
    - build-docker-image
  script: |
    docker exec -i $CONTAINER_NAME pylint --fail-under=7.0 app/
    docker exec -i $CONTAINER_NAME pylint --fail-under=7.0 tests/

test-units:
  extends: .test_template
  needs:
    - build-docker-image
  script: |
    docker exec -i $CONTAINER_NAME pytest \
      --html=public/report.html --self-contained-html \
      --junitxml=public/junit.xml \
      --cov=app \
      --cov-report=xml:public/coverage.xml \
      --cov-report=html:public/htmlcov \
      --cov-report=term \
        -v --disable-warnings
    docker cp $CONTAINER_NAME:/code/public ./public
  artifacts:
    when: always
    paths:
      - public
    reports:
      junit: public/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: public/coverage.xml
    expire_in: 1 week
  coverage: '/^TOTAL.*\s+(\d+\%)$/'

test-integration:
  extends: .test_template
  needs:
    - build-docker-image
  script:
    - sleep 15
    - docker compose -f docker-compose-prod.yml ps -a
    - docker exec -i $CONTAINER_NAME curl --fail http://localhost:8000/

release:
  image: docker:28.4.0
  stage: release
  services:
    - docker:28.4.0-dind
  needs:
    - test-integration
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never
  environment: release
  variables:
    DOCKER_REGISTRY: docker.io
    DOCKER_REG_USER: $DOCKER_HUB_USERNAME
    DOCKER_REG_PASS: $DOCKER_HUB_ACCESS_TOKEN
  before_script: |
      apk add --no-cache git python3 py3-pip
      python3 -m venv /venv
      . /venv/bin/activate
      pip install --no-cache-dir bump2version

      git config --global user.name "$GITLAB_USER_LOGIN"
      git config --global user.email "$GITLAB_USER_EMAIL"
      git remote set-url origin "https://oauth2:${GITLAB_PUSH_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

      echo "$DOCKER_REG_PASS" | \
          docker login -u "$DOCKER_REG_USER" --password-stdin $DOCKER_REGISTRY
  script: |
      bump2version ${VERSION_BUMP:-patch} --commit --tag \
           --message "Release {current_version} → {new_version} [skip ci]"

      git pull origin main
      git push origin HEAD:main
      git push origin --tags
      NEW_VERSION=$(git describe --tags --abbrev=0)
      echo "📦 New version: $NEW_VERSION"

      docker build -t $DOCKER_IMAGE:gl-$NEW_VERSION -t $DOCKER_IMAGE:gl-latest .
      docker push $DOCKER_IMAGE:gl-$NEW_VERSION
      docker push $DOCKER_IMAGE:gl-latest

deploy:
  image: alpine:3.22
  stage: deploy
  needs:
    - release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never
  environment: production
  before_script:
    - apk add curl
  script:
    - curl $RENDER_DEPLOY_HOOK
