---
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never

stages:
  - build
  - test
  - release

variables:
  GITLAB_DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  GITLAB_DOCKER_LATEST: $CI_REGISTRY_IMAGE:latest
  DOCKER_REGISTRY: docker.io
  DOCKER_HUB_IMAGE: harasani/fastapi
  DOCKER_HUB_LATEST: harasani/fastapi:latest
  CONTAINER_NAME: fastapi
  VERSION_BUMP: patch  # bump version (patch / minor / major)

.build_template:
  image: docker:28.4.0
  stage: build
  services:
    - docker:28.4.0-dind
  variables:
    DOCKER_REG: ''
    DOCKER_REG_USER: ''
    DOCKER_REG_PASS: ''
    DOCKER_IMAGE: ''
    DOCKER_LATEST: ''
  before_script:
    - docker login $DOCKER_REG -u $DOCKER_REG_USER -p $DOCKER_REG_PASS
  script:
    - docker build -t $DOCKER_IMAGE -t $DOCKER_LATEST .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_LATEST

.test_template:
  stage: test
  image: docker:28.4.0
  services:
    - docker:28.4.0-dind
  environment: test
  variables:
    DOCKER_REG: $CI_REGISTRY
    DOCKER_REG_USER: $CI_REGISTRY_USER
    DOCKER_REG_PASS: $CI_REGISTRY_PASSWORD
    DOCKER_IMAGE: $GITLAB_DOCKER_IMAGE
  before_script:
    - apk add curl jq
    - docker login $DOCKER_REG -u $DOCKER_REG_USER -p $DOCKER_REG_PASS
    - docker pull $DOCKER_IMAGE
    - export PROJECT_IMAGE_NAME=$DOCKER_IMAGE
    - docker compose -f docker-compose-prod.yml up -d
    - docker compose -f docker-compose-prod.yml ps -a
  script:
    - echo "Put your code here."

build-docker-image:
  extends: .build_template
  variables:
    DOCKER_REG: $CI_REGISTRY
    DOCKER_REG_USER: $CI_REGISTRY_USER
    DOCKER_REG_PASS: $CI_REGISTRY_PASSWORD
    DOCKER_IMAGE: $GITLAB_DOCKER_IMAGE
    DOCKER_LATEST: $GITLAB_DOCKER_LATEST

test-code-lint:
  extends: .test_template
  needs:
    - build-docker-image
  script:
    - docker exec -i $CONTAINER_NAME pylint --fail-under=7.0 app/
    - docker exec -i $CONTAINER_NAME pylint --fail-under=7.0 tests/

test-units:
  extends: .test_template
  needs:
    - build-docker-image
  script:
    - docker exec -i $CONTAINER_NAME pytest -v --disable-warnings

test-integration:
  extends: .test_template
  needs:
    - build-docker-image
  script:
    - sleep 15
    - docker compose -f docker-compose-prod.yml ps -a
    - docker compose -f docker-compose-prod.yml logs
    - docker exec -i $CONTAINER_NAME curl --fail http://localhost:8000/

create_git_tag:
  image: python:3.11-slim
  stage: release
  #  needs:
  #    - test-integration
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  environment: release
  variables:
    GITLAB_TOKEN: $GITLAB_FASTAPI_ACCESS_TOKEN
  before_script:
    - apt update -qq
    - apt install -y git -qqq
    - pip install --upgrade pip
    - pip install bump2version
    - git config --global user.name "$GITLAB_USER_LOGIN"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git fetch --tags
  script:
    - |
      NEW_VERSION=$(bump2version patch --dry-run --list | grep new_version | sed 's/new_version=//')
      echo "NEW_VERSION=$NEW_VERSION" | tee -a variables.env
    - |
      BUMP="${VERSION_BUMP:-patch}"
      bump2version $BUMP --commit --tag --message "Bump version: {current_version} → {new_version}"
    - |
      git push https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git --tags
  artifacts:
    reports:
      dotenv: variables.env

push-docker-image:
  extends: .build_template
  stage: release
  dependencies:
    - create_git_tag
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  environment: release
  variables:
    DOCKER_REG: $DOCKER_REG
    DOCKER_REG_USER: $DOCKER_HUB_USERNAME
    DOCKER_REG_PASS: $DOCKER_HUB_ACCESS_TOKEN
    DOCKER_IMAGE: $DOCKER_REG/$DOCKER_HUB_IMAGE:$NEW_VERSION
    DOCKER_LATEST: $DOCKER_REG/$DOCKER_HUB_LATEST
  after_script:
    - echo "Pushed $DOCKER_IMAGE image on $DOCKER_REG docker registry"

